<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pac-Man Clean</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <header class="hud">
        <div class="hud__left">
          <div class="hud__item"><span class="hud__label">Score</span> <span id="score">0</span></div>
          <div class="hud__item"><span class="hud__label">Level</span> <span id="level">1</span></div>
        </div>
        <div class="hud__right">
          <div class="hud__item"><span class="hud__label">Lives</span> <span id="lives">3</span></div>
          <div class="hud__item" id="state">Ready</div>
        </div>
      </header>

      <main class="stage">
        <canvas id="game" width="448" height="576" tabindex="0"></canvas>
      </main>

      <footer class="help">
        <div><b>Move</b>: Arrows / WASD · Swipe · D-pad · <b>Pause</b>: P · <b>Restart</b>: R</div>
      </footer>

      <div class="touch" aria-hidden="true">
        <div class="touch__pad" id="dpad">
          <button class="touch__btn touch__btn--up" data-dir="UP" aria-label="Up">▲</button>
          <button class="touch__btn touch__btn--left" data-dir="LEFT" aria-label="Left">◀</button>
          <button class="touch__btn touch__btn--right" data-dir="RIGHT" aria-label="Right">▶</button>
          <button class="touch__btn touch__btn--down" data-dir="DOWN" aria-label="Down">▼</button>
        </div>
        <div class="touch__actions">
          <button class="touch__btn touch__btn--action" id="btnPause" aria-label="Pause">Pause</button>
          <button class="touch__btn touch__btn--action" id="btnRestart" aria-label="Restart">Restart</button>
        </div>
      </div>
    </div>

    <script defer src="game.js"></script>
  </body>
</html>
